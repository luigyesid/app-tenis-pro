name: Revisar acceso publico
on:
  push:
    branches: [claude/project-thread-xzb392]
    paths: ['.github/workflows/check-public.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://tenispro-app.netlify.app/landing/ | grep -ai -B2 -A8 'hud' | head -40 | sed 's/^/HTML /'
          curl -s "https://tenispro-app.netlify.app/.netlify/scripts/hud?variant=public" -o /tmp/h.js; echo "JS bytes=$(wc -c </tmp/h.js)"
          grep -aoE 'customElements\.define\("[^"]+"|localStorage[^;]{0,80}|data-[a-z-]*(hide|disable|badge)[a-z-]*|(hide|dismiss|disable)[A-Za-z]{0,30}|settings?[^;]{0,60}badge[^;]{0,60}' /tmp/h.js | sort -u | head -40 | sed 's/^/JS /'
