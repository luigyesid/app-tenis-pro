name: Revisar acceso publico
on:
  push:
    branches: [claude/project-thread-xzb392]
    paths: ['.github/workflows/check-public.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36'
          for u in https://tenispro-app.netlify.app/ https://tenispro-app.netlify.app/landing/; do
            curl -s -A "$UA" "$u" -o /tmp/b; echo "RESULT $u bytes=$(wc -c </tmp/b)"; grep -aio '[^"<>]\{0,80\}netlify[^"<>]\{0,80\}' /tmp/b | grep -v tenispro-app.netlify.app | sed 's/^/MATCH /' | head -20
          done
