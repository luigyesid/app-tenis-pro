name: Revisar acceso publico
on:
  push:
    branches: [claude/project-thread-xzb392]
    paths: ['.github/workflows/check-public.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://tenispro-app.netlify.app/.netlify/scripts/hud?variant=public" -o /tmp/h.js
          grep -aoE '.{0,60}(STORE_KEY *=|createElement\(|attachShadow|\.id *=|setAttribute\("id"|appendChild|dismissal|variant|tier|upgrade|disable|opt.?out|data-nf-[a-z-]+).{0,90}' /tmp/h.js | head -60 | sed 's/^/JS /'
